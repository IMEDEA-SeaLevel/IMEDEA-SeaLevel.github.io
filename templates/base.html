<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="icon" type="image/svg+xml" href="static/img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./"><img src="static/img/logo.svg" alt="">{{ site.title }}</a>
    <nav aria-label="Main">
      <a href="./" {% if page == 'projects' %}aria-current="page"{% endif %}>Projects</a>
      <a href="publications.html" {% if page == 'publications' %}aria-current="page"{% endif %}>Publications</a>
      <a href="repositories.html" {% if page == 'repositories' %}aria-current="page"{% endif %}>Repositories</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block main %}{% endblock %}
</main>
<footer>
  <div class="wrap">
    <p>{{ site.title }} · IMEDEA (CSIC-UIB) · University of the Balearic Islands</p>
    <p><a href="https://github.com/{{ site.github_org }}">github.com/{{ site.github_org }}</a></p>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
