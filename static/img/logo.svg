<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IMEDEA Sea Level">
  <defs><clipPath id="r"><rect width="64" height="64" rx="15"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#0e2a3b"/>
    <!-- water body: surface rises from left to right -->
    <path d="M0 44 C8 38 14 38 22 43 S36 47 44 36 56 24 64 27 V64 H0Z" fill="#1f6f8b"/>
    <path d="M0 53 C10 48 18 49 28 53 S46 56 64 46 V64 H0Z" fill="#2d8fae" opacity=".55"/>
    <!-- reference level -->
    <path d="M7 34 H57" stroke="#f4efe6" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6" opacity=".7"/>
    <!-- sea surface -->
    <path d="M0 44 C8 38 14 38 22 43 S36 47 44 36 56 24 64 27" fill="none" stroke="#f4efe6" stroke-width="3.5" stroke-linecap="round"/>
    <!-- extreme marker -->
    <circle cx="51" cy="27.5" r="5.5" fill="#ff7a4d" stroke="#0e2a3b" stroke-width="2.5"/>
  </g>
</svg>
