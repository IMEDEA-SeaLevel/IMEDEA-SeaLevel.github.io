name: Update data, build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # every Monday, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Update repositories and publications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        # If a data source is down the site is still built from the last saved data.
        run: |
          python scripts/update_repositories.py || echo "::warning::Could not update repositories"
          python scripts/update_publications.py || echo "::warning::Could not update publications"

      - name: Commit data changes
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update repositories and publications data"
            git push
          fi

      - name: Build site
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
